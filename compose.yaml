services:
  database:
    image: mariadb:10.11
    command:
      - --bind-address=127.0.0.1
      - --sql-mode=NO_AUTO_VALUE_ON_ZERO,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    network_mode: host
    environment:
      MARIADB_DATABASE: ${DB_NAME:-medniima_school}
      MARIADB_USER: ${DB_USER:-medniima}
      MARIADB_PASSWORD: ${DB_PASS:-medniima-local-dev}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-medniima-root-dev}
    volumes:
      - medniima_db:/var/lib/mysql
      - ./mednima site script/medniima_school.sql:/docker-entrypoint-initdb.d/001-school.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mednima site script:/var/www/html
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ${DB_USER:-medniima}
      DB_PASS: ${DB_PASS:-medniima-local-dev}
      DB_NAME: ${DB_NAME:-medniima_school}
    depends_on:
      database:
        condition: service_healthy

volumes:
  medniima_db:
